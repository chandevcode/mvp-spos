app = "spos"
primary_region = "sin"
console_command = "/rails/bin/rails console"

[build]

[env]
  DATABASE_URL = "sqlite3:///data/production.sqlite3"
  PORT = "8080"
  RAILS_ENV = "production"
  RAILS_LOG_TO_STDOUT = "true"

[processes]
  app = "bash -c 'bin/rails db:prepare && bin/rails server -b 0.0.0.0 -p 8080'"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "60s"
    method = "GET"
    path = "/up"
    protocol = "http"

[[vm]]
  memory = "1gb"
  cpus = 1
